; J.A.R.V.S LINK V1 — PlatformIO build configuration
;
; Board target: ESP32-S3 dev board. The firmware will NOT guess pinout:
; firmware/config/pins.h holds every GPIO and ships with -1 placeholders.
; With -1 the device boots to OLED state ERROR — "NO PINS CONFIGURED" and
; does not touch any GPIO. Fill in real numbers after confirming your board.

[env:esp32-s3-devkitc-1]
platform = espressif32@6.7.0        ; Arduino core 2.x / ESP-IDF 4.4 (classic I2S API)
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
  -DCORE_DEBUG_LEVEL=1
  -I.            ; resolve #include "config/pins.h" from the project root

lib_deps =
  Links2004/WebSockets@^2.4.1
  bblanchon/ArduinoJson@^7.0.4
  adafruit/Adafruit SSD1306@^2.5.10
  adafruit/Adafruit GFX Library@^1.11.9
  adafruit/Adafruit BusIO@^1.14.5