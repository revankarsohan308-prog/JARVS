[project]
name = "nexora"
version = "0.1.0"
description = "NEXORA — Intelligent AI Ecosystem (REAL. ORIGINAL. VERIFIED.)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Sohan Revankar", email = "sohan@revankar.in" }
]
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.2",
    "pydantic==2.11.3",
    "pydantic-settings==2.9.1",
    "sqlalchemy==2.0.40",
    "httpx==0.28.1",
    "psutil==7.0.0",
    "python-dotenv==1.1.0",
    "alembic==1.15.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-asyncio==0.26.0",
    "ruff==0.11.6",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "build", "dist", "apps", "node_modules"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
